buildscript {
    ext.agp_version = '8.5.2'
    ext.kotlin_version = '2.3.0'
    repositories {
        // Mirrors first
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        // Fallback
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.1'
    }

    // Ensure buildscript classpath doesn't pull an older kotlin-stdlib (e.g. 1.7.x),
    // which can crash the Kotlin compile daemon with `NoClassDefFoundError:
    // kotlin/enums/EnumEntriesKt`.
    configurations.classpath {
        resolutionStrategy.force(
                "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version",
                "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version",
                "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        )
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

// Keep Kotlin stdlib versions aligned with the Kotlin Gradle plugin.
// This prevents Gradle from pulling a newer kotlin-stdlib (e.g. 2.2.x) that the
// current Kotlin compiler can't read, which produces:
// "Module was compiled with an incompatible version of Kotlin metadata..."
subprojects { project ->
    def rootAgpVersion = rootProject.ext.agp_version
    def rootKotlinVersion = rootProject.ext.kotlin_version

    // Some Flutter plugins still include their own legacy `buildscript { dependencies { classpath ... } }`
    // with hardcoded AGP/Kotlin versions (e.g. `share_plus` uses Kotlin 1.7.x; `android_intent_plus`
    // uses AGP 8.12.x). Force everything to a single version set to prevent Kotlin compiler crashes
    // that often show up as `GradleKotlinCompilerWorkAction` + `InvocationTargetException`.
    project.buildscript.configurations.classpath {
        resolutionStrategy.force(
                "org.jetbrains.kotlin:kotlin-stdlib:$rootKotlinVersion",
                "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$rootKotlinVersion",
                "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$rootKotlinVersion"
        )
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.android.tools.build" && details.requested.name == "gradle") {
                details.useVersion(rootAgpVersion)
            }
            if (details.requested.group == "org.jetbrains.kotlin" && details.requested.name == "kotlin-gradle-plugin") {
                details.useVersion(rootKotlinVersion)
            }
        }
    }

    project.configurations.configureEach { cfg ->
        cfg.resolutionStrategy.force(
                "org.jetbrains.kotlin:kotlin-stdlib:$rootKotlinVersion",
                "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$rootKotlinVersion",
                "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$rootKotlinVersion"
        )
    }
}

rootProject.buildDir = '../build'
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
            project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 34
                buildToolsVersion "34.0.0"
            }
        }
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
