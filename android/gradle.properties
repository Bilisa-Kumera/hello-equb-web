org.gradle.jvmargs=-Xmx4608m
android.useAndroidX=true
android.enableJetifier=true
#org.gradle.java.home=C:\\Program Files\\Java\\jdk-17
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Work around Kotlin Build Tools API snapshot transform crashes seen with some
# Gradle/AGP/Kotlin combinations (e.g. `Could not initialize class
# org.jetbrains.kotlin.build.report.metrics.GradleBuildTime`).
kotlin.incremental.useClasspathSnapshot=false
kotlin.build.report.enable=false

# Avoid Kotlin compile daemon startup crashes caused by classpath stdlib mismatches.
# This makes compilation run inside the Gradle process.
kotlin.compiler.execution.strategy=in-process
