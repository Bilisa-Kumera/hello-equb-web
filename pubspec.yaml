name: helloequb
description: "Equb smart with Hello Equb."

publish_to: 'none'

version: 1.4.11+24

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  go_router: ^14.3.0
  cupertino_icons: ^1.0.2
  carousel_slider: ^5.0.0
  flutter_spinkit: ^5.2.1
  loading_animation_widget: ^1.2.1
  intl_phone_field: ^3.2.0
  connectivity_plus: ^7.0.0
  android_intent_plus: ^6.0.0 
  dio: ^5.4.3+1
  get: ^4.6.6
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.2.2
  firebase_messaging: ^16.2.1
  firebase_core: ^4.8.0
  socket_io_client: ^2.0.3+1
  smooth_page_indicator: ^1.2.0
  image_picker: ^1.1.2
  mime: ^1.0.5
  http_parser: ^4.0.2
  googleapis_auth: ^1.6.0
  gcloud: ^0.8.12
  intl: ">=0.19.0 <0.21.0"
  flutter_fortune_wheel: ^1.3.1
  confetti: ^0.7.0
  rxdart: ^0.28.0
  firebase_analytics: ^12.4.0
  flutter_local_notifications: ^17.2.2
  provider: ^6.1.2
  dots_indicator: ^4.0.1
  flutter_screenutil: ^5.9.3
  pdf: ^3.11.1
  open_file: ^3.5.9
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  dio_cache_interceptor: ^3.5.0
  shared_preferences: ^2.3.3
  iconsax: ^0.0.8
  flutter_localization: ^0.3.0
  logger: ^2.5.0
  flutter_inappwebview: ^6.1.5
  # device_info_plus: ^11.3.0
  permission_handler: ^11.3.1
  email_validator: ^3.0.0
  share_plus: ^11.0.0
  gap: ^3.0.1
  in_app_update: ^4.2.2
  # mobile_number: ^3.0.0
  flutter_js: ^0.8.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/splash.png"
  image_path: "assets/splash.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/splash.png"

flutter:

  uses-material-design: true
  assets:
    - assets/
    - shorebird.yaml
  fonts:
    - family: poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf